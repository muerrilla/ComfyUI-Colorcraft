name: Track Traffic

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Fetch traffic and save to Gist
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
          GIST_ID: ${{ secrets.TRAFFIC_GIST_ID }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TODAY_TS="${TODAY}T00:00:00Z"

          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/clones" > /tmp/clones.json

          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/traffic/views" > /tmp/views.json

          curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" > /tmp/gist.json

          python3 .github/scripts/update_gist.py "$TODAY" "$TODAY_TS" "$GIST_ID" "$GH_TOKEN"
